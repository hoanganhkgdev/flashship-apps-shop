name: flashship_shop
description: FlashShip Shop App - Quản lý đơn giao hàng cho shop
publish_to: 'none'
version: 10.0.1+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Network
  dio: ^5.7.0

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Location & Maps
  geolocator: ^14.0.0
  google_maps_flutter: ^2.9.0

  # Storage
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2

  # UI
  google_fonts: ^6.2.1

  # Firebase / Push notifications + Realtime
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  firebase_database: ^11.3.5

  # WebView
  webview_flutter: ^4.10.0

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.2
  local_auth: ^3.0.2
  flutter_secure_storage: ^10.3.1
  crypto: ^3.0.7
  device_info_plus: ^12.4.0

dependency_overrides:
  # Pinned: newer path_provider_foundation versions break iOS build on this toolchain.
  path_provider_foundation: 2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/map_style.json
